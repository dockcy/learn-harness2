<path d="M380,516.0 L482,401.6" stroke="#2f6f5e" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
<path d="M820,126.0 L718,265.1" stroke="#6a4c93" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
