<path d="M820,386.0 L718,356.1" stroke="#2d5b8a" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
<path d="M820,516.0 L718,401.6" stroke="#8a6d1f" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
