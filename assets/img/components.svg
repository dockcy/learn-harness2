<svg xmlns="http://www.w3.org/2000/svg" class="svg-comp" viewBox="0 0 1200 660" role="img" aria-label="harness 的八个组件围绕冻结的模型">
<style>.svg-comp text{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;fill:#2a2723} .svg-comp .m{font-family:Menlo, Consolas, "JetBrains Mono", monospace} .svg-comp .ct{font-size:15px;font-weight:800} .svg-comp .cp{font-size:12px;fill:#6b655b} .svg-comp .cf{font-size:12.5px;fill:#4a453e} .svg-comp .gh{font-size:14px;font-weight:800} .svg-comp .badge{font-size:11px;font-weight:800;fill:#fff} .svg-comp .card{fill:#fffdf8;stroke-width:2}</style>
<defs><marker id="ah-svg-comp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6f685d"/></marker><marker id="ahr-svg-comp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c4402b"/></marker></defs>
<text x="20" y="34" text-anchor="start" style="font-size:22px;font-weight:800">第1站｜一副“马具”的八个部件（以默认执行器 OpenCode 为例）</text>
<text x="1180" y="34" text-anchor="end" style="font-size:13px;fill:#6b655b">点击任一部件看详解</text>
<path d="M380,126.0 L482,265.1" stroke="#2f6f5e" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
<path d="M380,256.0 L482,310.6" stroke="#2f6f5e" stroke-width="1.6" stroke-dasharray="4 4" fill="none" opacity=".7"/>
