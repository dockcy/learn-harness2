<text x="122" y="204" class="d">run_sweep（多领域并发）→ run_domain（领域内按序、把经验库往后传）→ run_task（k 次基础执行 → 每种模式 → 盲选 → summary.json）</text>
<text x="122" y="222" class="d">→ _run_one_mode：run_mode → selection_pool → run_selection → reflect_adoption → Library.add</text>
